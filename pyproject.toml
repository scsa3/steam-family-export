[project]
name = "steam-family-export"
version = "0.1.0"
description = "Export Steam Families library and player-attributed playtime"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1"]

[project.scripts]
steam-family-export = "steam_family_export.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steam_family_export"]
